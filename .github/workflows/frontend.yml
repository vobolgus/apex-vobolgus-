name: Frontend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: Lint and format check (eslint + prettier)
        run: npm run lint

      - name: Vitest unit tests
        run: npm run test:unit

      - name: Production build
        run: npm run build

      - name: Install Rust toolchain (for backend during e2e)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          # hashFiles() and actions/cache paths resolve against the workspace root,
          # NOT against defaults.run.working-directory. A leading ../ escapes the
          # workspace and fails template validation before any step runs.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build backend (release for faster startup)
        working-directory: .
        run: cargo build --release -p backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend in background
        working-directory: .
        run: |
          nohup ./target/release/backend > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ -o /dev/null; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to start"
          tail -50 /tmp/backend.log
          exit 1

      - name: Start frontend dev server
        run: |
          nohup npm run dev -- --host 0.0.0.0 --port 5174 > /tmp/frontend.log 2>&1 &
          # Probe /generator, not /. Vite compiles routes on first request, so
          # hitting the route the tests use warms it here instead of during the
          # first test, where a not-yet-hydrated page swallows clicks.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5174/generator -o /dev/null; then
              echo "frontend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "frontend failed to start"
          tail -50 /tmp/frontend.log
          exit 1

      - name: Playwright tests
        run: npx playwright test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/e2e-results/
          retention-days: 7
