[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
rust-core = { path = "../rust-core" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svg2pdf = "0.12"
# The version svg2pdf builds on: its chunks are assembled into one multi-page PDF.
pdf-writer = "0.12"
chrono = { version = "0.4", features = ["serde"] }
# Gzip for the catalog responses, compressed once at startup (see src/cached.rs).
flate2 = "1.1"
# `fs` and `set-header` serve the frontend's static build (see src/static_site.rs).
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
