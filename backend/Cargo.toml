[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# `main` over the library of the same name: documented once, as the library.
[[bin]]
name = "backend"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1"
rust-core = { path = "../rust-core" }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
svg2pdf = "0.12"
# The version svg2pdf builds on: its chunks are assembled into one multi-page PDF.
pdf-writer = "0.12"
chrono = { version = "0.4", features = ["serde"] }
# Gzip for the catalog responses, compressed once at startup (see src/cached.rs).
flate2 = "1.1"
# `fs` and `set-header` serve the frontend's static build (see src/static_site.rs).
tower-http = { version = "0.5", features = ["cors", "fs", "set-header"] }
tower = { version = "0.5.3", features = ["util"] }
# The typed errors of the checks and the conversions, and the one a handler answers with.
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
# Says the wire types in TypeScript for the page: a test writes and checks the
# frontend's copy (see src/wire.rs), so the server itself is built without it.
ts-rs = "12"
