[workspace]
resolver = "3"
members = [
    "rust-core",
    "backend"
]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Stars are kept in f32, the maths runs in f64 and a chart ends in whole pixels: the
# narrowing casts between them are part of the formulas, on values in range by
# construction. A cast that can change a sign is excepted where it is made.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Coefficients are written as they are printed, to be checked against the page.
unreadable_literal = "allow"
